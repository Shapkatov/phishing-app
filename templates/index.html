<!DOCTYPE html>
<html>
<head>
    <title>Phishing Detector</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #141e30, #243b55);
            color: white;
            text-align: center;
            padding-top: 50px;
        }
        input {
            padding: 12px;
            width: 300px;
            border-radius: 8px;
            border: none;
        }
        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: #00c6ff;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        .box {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
        }
        .history {
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔐 Phishing Detection Tool</h1>
        <p>Check if a website is safe</p>

        <form method="POST">
            <input type="text" name="url" placeholder="Enter URL" required>
            <br><br>
            <button type="submit">Check</button>
        </form>

        <h2>{{ result }}</h2>

        <div class="history">
            <h3>History</h3>
            {% for item in history %}
                <p>{{ item }}</p>
            {% endfor %}
        </div>

        <p style="font-size: 12px;">This tool uses rule-based detection</p>
    </div>
</body>
</html>
